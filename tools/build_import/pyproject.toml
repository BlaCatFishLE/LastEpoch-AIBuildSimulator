[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "le-build"
version = "0.1.0"
description = "Last Epoch phase-2 build importer: LE Tools share links to offline BuildSpec v1"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
le-build = "le_build.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
le_build = ["data/*.json"]
